<div class="grid grid-cols-[1.4fr_1fr_1fr] gap-4">
  <app-stat-card
    variant="accent"
    label="Resumen General"
    [value]="stats.total"
    [growth]="stats.growth"
    icon="📦"
    [extraRows]="[
      { label: 'Este Mes', value: stats.thisMonth },
      { label: 'Compartidos', value: stats.shared }
    ]"
  ></app-stat-card>

  <app-stat-card
    variant="primary"
    label="Por Revisar"
    [value]="stats.toReview"
    icon="📋"
  ></app-stat-card>

  <app-stat-card
    label="Firmados"
    [value]="stats.signed"
    icon="✅"
  ></app-stat-card>
</div>
