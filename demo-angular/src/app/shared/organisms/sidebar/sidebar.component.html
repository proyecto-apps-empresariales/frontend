<aside class="w-[220px] h-full bg-[#1a1f36] flex flex-col flex-shrink-0 relative after:content-[''] after:absolute after:right-0 after:top-0 after:w-px after:h-full after:bg-white/[0.06]">

  <!-- Brand -->
  <div class="flex items-center justify-center gap-2.5 px-4 py-5 border-b border-white/[0.07] mb-2">
    <div class="flex flex-col gap-0.5">
      <span class="font-[family-name:var(--font-display)] text-2xl font-extrabold text-white tracking-[-0.3px]">docuCMB</span>
      <span class="text-xs text-white/40 tracking-[0.3px]">Executive Portal</span>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex-1 flex flex-col gap-0.5 px-2.5">
    <app-nav-item *ngFor="let link of navLinks"
      [label]="link.label" [icon]="link.icon"
      [route]="link.route" [active]="link.active"
    ></app-nav-item>
  </nav>

  <!-- User -->
  <div (click)="logOut()" class="flex items-center justify-center px-4 py-4 bg-white/[0.05] cursor-pointer hover:bg-white/[0.1] transition-colors duration-150 rounded-2xl m-2">
    <p class="font-[family-name:var(--font-display)]  text-sm font-medium text-white">Cerrar Sesion</p>
  </div>
</aside>
