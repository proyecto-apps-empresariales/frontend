<div class="flex flex-col gap-6">

  <div>
    <h2 class="text-3xl font-bold font-brand text-gray-900">Ingreso</h2>
    <p class="text-gray-500 mt-1 text-sm">Complete los detalles para ingresar.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

    <app-form-field
      label="Correo Electrónico"
      type="email"
      placeholder="ejemplo@cobalt.com"
      icon="@"
      [control]="f['email']"
    />

    <app-form-field
      label="Contraseña"
      type="password"
      placeholder="••••••••••••"
      icon="🔒"
      [control]="f['password']"
    />

    <!-- Mensaje de error de la API -->
    @if (errorMsg) {
      <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3
                  text-[13px] text-red-600 font-medium flex items-center gap-2">
        ⚠️ {{ errorMsg }}
      </div>
    }

    <app-button type="submit" class="mt-2" [attr.disabled]="loading || null">
      {{ loading ? 'Ingresando...' : 'Ingresar →' }}
    </app-button>

  </form>

  <p class="text-center text-sm text-gray-500">
    ¿No tienes cuenta?
    <a routerLink="/register" class="text-brand-orange font-semibold hover:underline ml-1">
      Registrate
    </a>
  </p>

</div>
