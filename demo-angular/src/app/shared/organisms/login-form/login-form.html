<div class="flex flex-col gap-6">

  <div>
    <h2 class="text-3xl font-bold font-brand text-gray-900">Ingreso</h2>
    <p class="text-gray-500 mt-1 text-sm">Complete los detalles para ingresar.</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">


    <app-form-field
      label="Correo Electrónico"
      type="email"
      placeholder="ejemplo@cobalt.com"
      icon="@"
      [control]="f['email']"
    />

    <app-form-field
      label="Contraseña"
      type="password"
      placeholder="••••••••••••"
      icon="🔒"
      [control]="f['password']"
    />

    <app-button type="submit" class="mt-2">
      Ingresar →
    </app-button>

  </form>


  <!-- Link login -->
  <p class="text-center text-sm text-gray-500">
    ¿No tienes cuenta?
    <a href="#" class="text-brand-orange font-semibold hover:underline ml-1">Registrate</a>
  </p>

</div>
