<header class="flex items-center justify-between px-7 h-[52px] bg-white border-b border-slate-100 flex-shrink-0 gap-6">

  <nav class="flex items-center h-full">
    <button
      *ngFor="let tab of tabs"
      class="relative h-full px-4 font-[family-name:var(--font-display)] text-[13.5px] font-medium transition-colors duration-150 cursor-pointer bg-transparent border-none whitespace-nowrap"
      [class.text-slate-800]="tab.label === activeTab"
      [class.font-bold]="tab.label === activeTab"
      [class.text-slate-400]="tab.label !== activeTab"
      (click)="setTab(tab)"
    >
      {{ tab.label }}
      <span
        *ngIf="tab.label === activeTab"
        class="absolute bottom-0 left-4 right-4 h-0.5 bg-[#f5a623] rounded-t"
      ></span>
    </button>
  </nav>

  <div class="flex items-center gap-3 ml-auto">
    <app-search-bar [placeholder]="placeholder"></app-search-bar>
  </div>
</header>
