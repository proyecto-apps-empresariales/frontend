<div class="bg-white rounded-2xl shadow-[0_1px_3px_rgba(0,0,0,.06),0_4px_16px_rgba(0,0,0,.04)] overflow-hidden h-[380px] flex flex-col">

  <div class="px-5 py-4 border-b border-slate-100">
    <h3 class="font-[family-name:var(--font-display)] text-[15px] font-bold text-slate-800 flex items-center gap-2">
      {{title}} recientes
      <span class="w-[7px] h-[7px] rounded-full bg-[#f5a623] inline-block animate-pulse"></span>
    </h3>
  </div>

  <div class="flex-1 overflow-y-auto divide-y divide-slate-100">
    <app-document-item
      *ngFor="let doc of documents"
      [doc]="doc"
    ></app-document-item>
  </div>

</div>
