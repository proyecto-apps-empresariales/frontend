<div class= "bg-white rounded-2xl h-[500px] shadow-[0_1px_3px_rgba(0,0,0,.06),0_4px_16px_rgba(0,0,0,.04)] overflow-hidden flex flex-col">

  <div class="px-5 py-4 border-b border-slate-100">
    <h3 class="font-[family-name:var(--font-display)] text-[15px] font-bold text-slate-800 flex items-center gap-2">
      {{ title }}
      <span class="w-[7px] h-[7px] rounded-full bg-[#f5a623] inline-block animate-pulse"></span>
    </h3>
  </div>

  <div class="flex-1 overflow-y-auto divide-y divide-slate-100">
    @for (doc of items; track $index) {
      <app-document-item [isHistorial]="isHistorial" [isProcess]="isProcess" [isTypeP]="isTypeP" [setValues]="setValues" [isState]="isState" [isRole]="isRole" [isOrganization]="isOrganization" [isUser]="isUser" [doc]="doc" [isDocument]="isDocument" [isType]="isType" [isTemplate]="isTemplate" [isVersion]="isVersion" />
    } @empty {
      <p class="text-center text-slate-400 text-xs py-10">Sin resultados</p>
    }
  </div>

</div>
