<div class="flex flex-col gap-6">

  <div>
    <h2 class="text-3xl font-bold font-brand text-gray-900">Crear Cuenta</h2>
    <p class="text-gray-500 mt-1 text-sm">Complete los detalles para comenzar su experiencia.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

    <div class="grid grid-cols-2 gap-4">
      <app-form-field
        label="Nombre"
        placeholder="Juan"
        icon="👤"
        [control]="f['nombre']"
      />
      <app-form-field
        label="Apellido"
        placeholder="Pérez"
        icon="👤"
        [control]="f['apellido']"
      />
    </div>

    <app-form-field
      label="Correo Electrónico"
      type="email"
      placeholder="ejemplo@cobalt.com"
      icon="@"
      [control]="f['email']"
    />

    <app-form-field
      label="Celular"
      placeholder="3123456789"
      icon="📱"
      [control]="f['celular']"
    />

    <app-form-field
      label="Contraseña"
      type="password"
      placeholder="••••••••••••"
      icon="🔒"
      [control]="f['password']"
    />

    <app-form-field
      label="Confirmar Contraseña"
      type="password"
      placeholder="••••••••••••"
      icon="🔒"
      [control]="f['confirm']"
    />

    <!-- Contraseñas no coinciden -->
    @if (passwordMismatch) {
      <p class="text-[12.5px] text-red-500 -mt-2">Las contraseñas no coinciden.</p>
    }

    <!-- Error de la API -->
    @if (errorMsg) {
      <div class="rounded-lg bg-red-50 border border-red-200 px-4 py-3
                  text-[13px] text-red-600 font-medium flex items-center gap-2">
        ⚠️ {{ errorMsg }}
      </div>
    }

    <!-- Éxito -->
    @if (successMsg) {
      <div class="rounded-lg bg-green-50 border border-green-200 px-4 py-3
                  text-[13px] text-green-700 font-medium flex items-center gap-2">
        ✅ {{ successMsg }}
      </div>
    }

    <app-button type="submit" class="mt-2" [attr.disabled]="loading || null">
      {{ loading ? 'Creando cuenta...' : 'Registrarse →' }}
    </app-button>

  </form>

  <p class="text-center text-sm text-gray-500">
    ¿Ya tienes una cuenta?
    <a routerLink="/login" class="text-brand-orange font-semibold hover:underline ml-1">
      Iniciar Sesión
    </a>
  </p>

</div>
