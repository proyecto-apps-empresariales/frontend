<div class="flex flex-col gap-2">

  <!-- Drop zone -->
  <div
    class="relative flex flex-col items-center justify-center gap-3 rounded-xl border-2 border-dashed px-6 py-10 transition-all duration-200 cursor-pointer select-none"
    [class.border-brand-orange]="isDragging"
    [class.bg-orange-50]="isDragging"
    [class.border-gray-200]="!isDragging"
    [class.bg-gray-100]="!isDragging"
    (click)="openPicker(fileInput)"
  >
    <div class="text-4xl">{{ isDragging ? '📂' : '📁' }}</div>
    <div class="text-center">
      <p class="text-sm font-semibold text-gray-700">
        {{ isDragging ? 'Suelta el archivo aquí' : 'Arrastra tu archivo aquí' }}
      </p>
      <p class="text-xs text-gray-400 mt-0.5">
        o <span class="text-brand-orange font-medium underline">selecciona desde tu equipo</span>
      </p>
    </div>
    <input #fileInput type="file" class="hidden" [accept]="accept" [multiple]="multiple" (change)="onFileInput($event)" />
  </div>

  <!-- Lista de archivos cargados -->
  @if (files.length) {
    <ul class="flex flex-col gap-2">
      @for (file of files; track $index) {
        <li class="flex items-center justify-between bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
          <div class="flex items-center gap-2 truncate">
            <span class="text-base">📄</span>
            <span class="text-gray-700 font-medium truncate">{{ file.name }}</span>
            <span class="text-gray-400 text-xs shrink-0">{{ formatSize(file.size) }}</span>
          </div>
          <button
            (click)="removeFile($index)"
            class="ml-3 text-gray-400 hover:text-red-500 transition-colors shrink-0 text-lg leading-none"
          >×</button>
        </li>
      }
    </ul>
  }

</div>
