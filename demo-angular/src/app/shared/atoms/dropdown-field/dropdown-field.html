<div class="relative w-full">

  <!-- Trigger -->
  <button
    type="button"
    (click)="toggle()"
    class="w-full flex items-center justify-between bg-gray-100 rounded-xl px-4 py-3.5 text-sm
           border border-transparent transition-all duration-200 outline-none
           focus:border-brand-orange focus:bg-white"
    [class.pl-10]="icon"
    [class.opacity-50]="isDisabled"
    [class.cursor-not-allowed]="isDisabled"
    [class.border-brand-orange]="isOpen"
    [class.bg-white]="isOpen"
  >
    <!-- Ícono izquierdo -->
    <span *ngIf="icon"
      class="absolute left-4 text-gray-400 select-none pointer-events-none text-sm">
      {{ icon }}
    </span>

    <!-- Texto seleccionado o placeholder -->
    <span [class.text-gray-800]="selected" [class.text-gray-400]="!selected">
      {{ selected?.label ?? placeholder }}
    </span>

    <!-- Chevron -->
    <span class="ml-2 text-gray-400 transition-transform duration-200 text-xs"
      [class.rotate-180]="isOpen">
      ▼
    </span>
  </button>

  <!-- Lista de opciones -->
  <ul
    *ngIf="isOpen"
    class="absolute z-50 w-full mt-1.5 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden
           animate-[fadeIn_0.15s_ease]"
  >
    <li
      *ngFor="let option of options"
      (click)="select(option)"
      class="flex items-center justify-between px-4 py-3 text-sm text-gray-700 cursor-pointer
             hover:bg-orange-50 hover:text-gray-900 transition-colors duration-100"
      [class.font-semibold]="option.value === selected?.value"
      [class.text-brand-orange]="option.value === selected?.value"
    >
      {{ option.label }}
      <!-- Check mark si está seleccionado -->
      <span *ngIf="option.value === selected?.value" class="text-brand-orange text-xs">✓</span>
    </li>
  </ul>

</div>
