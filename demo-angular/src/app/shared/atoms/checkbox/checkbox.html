<label
  class="inline-flex items-center gap-3 cursor-pointer group"
  (click)="toggle()"
>
  <span
    class="w-5 h-5 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-all duration-200"
    [ngClass]="checked
      ? 'bg-brand-orange border-brand-orange shadow-md'
      : 'bg-white border-slate-300 group-hover:border-brand-orange'"
  >
    <svg *ngIf="checked" class="w-3 h-3 text-white" viewBox="0 0 12 12" fill="none">
      <path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span class="text-sm font-medium text-slate-700 group-hover:text-slate-900 transition-colors duration-150">
    {{ label }}
  </span>
</label>
