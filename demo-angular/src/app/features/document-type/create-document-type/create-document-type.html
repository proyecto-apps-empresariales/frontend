<app-dashboard-layout placeholder="Buscar tipos de documentos..." [tabs]="tabs">
  <div class="flex flex-col gap-6 animate-[fadeIn_0.3s_ease]">
    <!-- Hero -->
    <div class="flex items-start justify-between gap-4">
      <div>
        <h1
          class="font-(family-name:var(--font-display)) text-[26px] font-extrabold text-slate-800 tracking-tight mb-1"
        >
          Crear Tipos de Documentos
        </h1>
        <p class="text-[13.5px] text-slate-500">Ingresa todos los campos para crear un tipo de documento</p>
      </div>
    </div>

    <app-form-field
      label="Nombre"
      placeholder="Ingrese el nombre"
      icon="📄"
      [control]="nombreControl"
    />

    <app-form-field
      label="Descripción"
      placeholder="Ingrese la descripción"
      icon="📄"
      [control]="descripcionControl"
    />

    <div class="flex flex-col gap-3">
      <p class="text-sm font-semibold text-slate-700">Requerimientos</p>
      <div
        class="grid grid-cols-2 gap-3 p-4 bg-white rounded-2xl border border-slate-200 shadow-sm"
      >
        @for (req of requirements; track $index) {
          <app-checkbox
            [label]="req.nombre"
            [formControl]="$any(requirementsForm.get(req.nombre))"
          ></app-checkbox>
        }
      </div>
    </div>

    <app-button type="submit" (click)="submit()">+ Crear Tipo de Documento</app-button>
  </div>
</app-dashboard-layout>
