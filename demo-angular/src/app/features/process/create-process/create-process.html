<app-dashboard-layout placeholder="Buscar procesos..." [tabs]="tabs">
  <div class="flex flex-col gap-6 animate-[fadeIn_0.3s_ease]">

    <div class="flex items-start justify-between gap-4">
      <div>
        <h1 class="font-(family-name:var(--font-display)) text-[26px] font-extrabold text-slate-800 tracking-tight mb-1">
          {{ existing ? 'Editar Proceso' : 'Crear Proceso' }}
        </h1>
        <p class="text-[13.5px] text-slate-500">
          {{ existing ? 'Modifica los datos del proceso.' : 'Completa los campos para crear un proceso.' }}
        </p>
      </div>
    </div>

    <app-form-field label="Nombre" placeholder="Nombre del proceso" icon="📋" [control]="nombreControl" />
    <app-form-field label="Descripción" placeholder="Descripción del proceso" icon="📄" [control]="descripcionControl" />
    <app-form-field label="Fecha de vigencia" placeholder="yyyy-MM-dd" icon="📅" [control]="fechaFinControl" />

    <app-dropdown-field-label
      label="Tipo de petición"
      icon="⚙️"
      [options]="tipoLabels"
      [formControl]="tipoControl"
    />

    <app-dropdown-field-label
      label="Documento"
      icon="📄"
      [options]="documentoLabels"
      [formControl]="documentoControl"
    />

    <app-dropdown-field-label
      label="Destinatario"
      icon="👤"
      [options]="usuarioLabels"
      [formControl]="destinatarioControl"
    />

    <app-button type="submit" (click)="submit()">
      {{ existing ? 'Guardar cambios' : '+ Crear proceso' }}
    </app-button>

  </div>
</app-dashboard-layout>
