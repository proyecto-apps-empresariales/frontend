<app-dashboard-layout placeholder="Buscar Plantillas..." [tabs]="tabs">
  <div class="flex flex-col gap-6 animate-[fadeIn_0.3s_ease]">

    <!-- Hero -->
    <div class="flex items-start justify-between gap-4">
      <div>
        <h1 class="font-(family-name:var(--font-display)) text-[26px] font-extrabold text-slate-800 tracking-tight mb-1">Panel de Plantillas</h1>
      <p class="text-[13.5px] text-slate-500">Gestione y supervise las plantillas de los tipos de documentos.</p>
      </div>
      @if(isAdmin){
      <div class="flex items-center gap-2 shrink-0">
        <app-button (click)="goToCreate()">+ Crear plantilla</app-button>
      </div>
      }

    </div>

    <!-- Table -->
    <app-documents-table [isTemplate]="true" [isType]="false" [isDocument]="false" title="Plantillas" [items]="templates" [total]="templates.length" [columns]="documentColumns"></app-documents-table>

  </div>
</app-dashboard-layout>
