<app-dashboard-layout placeholder="Buscar documentos..." [tabs]="tabs">
  <div class="flex flex-col gap-6 animate-[fadeIn_0.3s_ease]">
    <!-- Hero -->
    <div class="flex items-start justify-between gap-4">
      <div>
        <h1
          class="font-(family-name:var(--font-display)) text-[26px] font-extrabold text-slate-800 tracking-tight mb-1"
        >
          Crear Documentos
        </h1>
        <p class="text-[13.5px] text-slate-500">Ingresa todos los campos para crear un documento</p>
      </div>
    </div>

    <app-form-field
      label="Nombre"
      placeholder="Ingrese el nombre"
      icon="📄"
      [control]="nombreControl"
    />
    <app-dropdown-field-label
      label="Tipo de documento"
      icon="📄"
      [options]="labels"
      labelKey="nombre"
      valueKey="nombre"
      [formControl]="tipoControl"
    />
    <app-form-field
      label="Descripción"
      placeholder="Ingrese la descripción"
      icon="📄"
      [control]="descripcionControl"
    />

    <app-button type="submit" (click)="submit()">+ Crear Documento</app-button>
  </div>
</app-dashboard-layout>
