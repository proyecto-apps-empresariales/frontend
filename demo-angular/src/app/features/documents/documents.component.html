<app-dashboard-layout placeholder="Buscar documentos..." [tabs]="tabs">
  <div class="flex flex-col gap-6 animate-[fadeIn_0.3s_ease]">

    <!-- Hero -->
    <div class="flex items-start justify-between gap-4">
      <div>
        <h1 class="font-(family-name:var(--font-display)) text-[26px] font-extrabold text-slate-800 tracking-tight mb-1">Panel de Documentos</h1>
        <p class="text-[13.5px] text-slate-500">Gestione y supervise el flujo documental de su organización.</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <app-button (click)="goToCreate()">+ Crear documento</app-button>
        <app-button>≡ Filtrar</app-button>

      </div>
    </div>

    <!-- Stats -->
    <app-stats-overview [stats]="stats"></app-stats-overview>

    <!-- Table -->
    <app-documents-table [items]="documents" [total]="stats.total" title="Documentos recientes"></app-documents-table>

  </div>
</app-dashboard-layout>
