<app-dashboard-layout placeholder="Buscar documentos..." [tabs]="tabs">
  <div class="flex flex-col gap-6 animate-[fadeIn_0.3s_ease]">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h1
          class="font-(family-name:var(--font-display)) text-[26px] font-extrabold text-slate-800 tracking-tight mb-1"
        >
          Versionar Documentos
        </h1>
        <p class="text-[13.5px] text-slate-500">Ingresa nuevas versiones del documento</p>
      </div>
    </div>

    <app-dropdown-field-label
      label="Nombre documento"
      icon="📄"
      [options]="labels"
      [formControl]="documentControl"
    />
    <app-form-field label="Descripción" [control]="descripcionControl"></app-form-field>
    <app-documents-table [isVersion]="true" [isDocument]="false" title="Versiones" [items]="versions" [total]="versions.length" [columns]="versionColumns"></app-documents-table>
  
    <app-file-field label="Archivo" accept=".pdf,.doc,.docx" [multiple]="false" (filesDropped)="onFileSelected($event)"></app-file-field>

    <app-button type="submit" (click)="submit()"> {{ isUploading ? 'Subiendo...' : '+ Versionar Documento' }}</app-button>
  </div>
</app-dashboard-layout>
