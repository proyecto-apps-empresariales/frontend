<app-dashboard-layout placeholder="Buscar usuarios..." [tabs]="tabs">
  <div class="flex flex-col gap-6 animate-[fadeIn_0.3s_ease]">

    <div class="flex items-start justify-between gap-4">
      <div>
        <h1 class="font-(family-name:var(--font-display)) text-[26px] font-extrabold text-slate-800 tracking-tight mb-1">
          Panel de Usuarios
        </h1>
        <p class="text-[13.5px] text-slate-500">Gestiona los usuarios del sistema.</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <app-button (click)="goToCreate()">+ Crear usuario</app-button>
      </div>
    </div>

    <app-documents-table
      title="Usuarios"
      [items]="users"
      [total]="users.length"
      [columns]="columns"
      [isDocument]="false"
      [isType]="false"
      [isUser]="true"
    ></app-documents-table>

  </div>
</app-dashboard-layout>
